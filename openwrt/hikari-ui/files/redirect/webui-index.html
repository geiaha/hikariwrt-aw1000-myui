<!DOCTYPE html>
<!--
  Installed as /www/webui-index.html by hikari-ui and listed first in
  uhttpd's index_page, so http://<router>/ opens the web UI instead of
  luci-base's /www/index.html (which still exists, and still wins inside any
  other folder). LuCI stays at /cgi-bin/luci/.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<meta http-equiv="refresh" content="0; URL=webui/" />
		<title>HikariWrt</title>
		<script>location.replace('webui/')</script>
		<style>
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8f3; color: #201b13; font-family: system-ui, sans-serif; }
			a { color: #7d570e; }
			p { text-align: center; line-height: 1.6; }
			@media (prefers-color-scheme: dark) {
				body { background: #18130b; color: #ece1d4; }
				a { color: #f1be6d; }
			}
		</style>
	</head>
	<body>
		<p>
			<a href="webui/">Open HikariWrt</a><br />
			<small><a href="cgi-bin/luci/">Advanced settings (LuCI)</a></small>
		</p>
	</body>
</html>
